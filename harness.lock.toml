# Which component versions are known to work together.
#
# Every component declares its own version — skills and agents in their frontmatter, scripts in a
# `# harness-version:` header line. This file is the compatible set. `scripts/check_versions.py`
# fails if a declaration and this file disagree, so drift is caught rather than discovered. It also
# fails on a component that is on disk but absent here, which is why every file present is listed
# even when nothing depends on it.
#
# Bump `release` when any component changes. Components carry the release they were last changed
# in, so a glance shows what moved.

release = "1.5.0"
released = "2026-09-07"

# scripts/install_tools.sh reads the versions below rather than repeating them, so a bump here
# is picked up there. Run it with --check in CI.
[requires]
python = ">=3.11"
uv = ">=0.5"          # PEP 723 inline script metadata
gh = ">=2.0"          # filing issues and pull requests, and reconciling the plan against them
sem = ">=0.24"        # optional: entity-level impact analysis. Nothing fails without it.
wt = ">=0.76"         # worktrunk, for per-agent worktrees and for removing them once merged

[skills]
render-harness = "1.0.0"
fix-loop = "1.2.0"        # 1.2.0: filing and reconciling are one step — order.py sync
property-testing = "1.0.0"
sem = "1.0.0"              # vendored from Ataraxy-Labs/sem @ 4210e1df5c7b, MIT OR Apache-2.0

[agents]
slide-comparator = "1.0.0"
failure-taxonomist = "1.0.0"
issue-investigator = "1.0.0"
issue-fixer = "1.2.0"     # 1.2.0: impact-check a shared function before scoping the fix
review-responder = "1.1.0"  # 1.1.0: impact-check before agreeing with a comment
property-tester = "1.0.0"

[scripts]
# All scripts move together: they share `common.py` and the on-disk layout, so a change to one
# deck or issue path affects every one of them. `order.py` is the exception — it owns ORDER.toml
# and nothing else reads it, so it versions on its own.
all = "1.0.0"
order = "1.3.0"           # 1.3.0: `sync` reconciles against GitHub and reclaims worktrees
check_versions = "1.1.0"  # 1.1.0: honours a per-script version key

# What each skill needs. A skill may run with newer components only if the major version matches.
[compatibility.render-harness]
agents = ["slide-comparator", "failure-taxonomist", "issue-investigator"]
scripts = "^1.0.0"

[compatibility.fix-loop]
agents = ["issue-fixer", "review-responder"]
scripts = "^1.0.0"
# fix-loop reads the issue folders render-harness produces, so it needs that skill's output shape.
skills = ["render-harness ^1.0.0"]

# property-testing, property-tester and sem are deliberately standalone: no skill or script calls
# them, and they are listed above only so check_versions.py can account for the files on disk.
# sem is vendored from upstream — re-vendor it rather than editing, and move the pinned commit in
# skills/sem/SKILL.md when you do.
